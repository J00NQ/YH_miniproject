{% extends 'base.html' %}
{% block title %}병실 관리{% endblock %}
{% block content %}
<h1>병실 관리</h1>

<div class="table-actions">
  <button type="button" class="btn-add"
          onclick="alert('병실 추가 기능은 준비 중입니다.')">+ 병실 추가</button>
</div>

<table>
  <tr>
    <th class="col-id">ID</th>
    <th>이름</th>
    <th>X</th>
    <th>Y</th>
    <th>θ (rad)</th>
    <th class="col-action">수정</th>
  </tr>
  {% for r in rooms %}
  <tr>
    <td>{{ r['id'] }}</td>
    <td><input form="form-{{ r['id'] }}" name="name"  value="{{ r['name'] }}"  required></td>
    <td><input form="form-{{ r['id'] }}" name="x"     value="{{ r['x'] }}"     type="number" step="any" required></td>
    <td><input form="form-{{ r['id'] }}" name="y"     value="{{ r['y'] }}"     type="number" step="any" required></td>
    <td><input form="form-{{ r['id'] }}" name="theta" value="{{ r['theta'] }}" type="number" step="any" required></td>
    <td class="col-action">
      <form id="form-{{ r['id'] }}" method="post"
            action="{{ url_for('rooms_edit', room_id=r['id']) }}">
        <button type="submit">저장</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
